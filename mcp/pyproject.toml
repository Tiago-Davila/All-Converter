[project]
name = "convertitodo-mcp"
version = "0.0.0"
description = "Servidor MCP de ConvertiTodo para crear, leer y convertir documentos"
requires-python = ">=3.12"
# Dependencias de runtime fijadas a versiones exactas
dependencies = [
    "fastmcp==4.1.8",
    "pydantic==2.14.3",
    "reportlab==5.1.0",
    "pypdf==7.0.1",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "markitdown[pdf,docx,xlsx,pptx]==0.1.9",
    "pypdfium2==5.15.2",
    "pillow==13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convertitodo_mcp"]
